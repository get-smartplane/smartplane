name: Deploy

# Manual, and gated by the `production` environment: add required reviewers to it in the repository settings
# so every production deploy is approved by someone other than the person who started it.
# The marketing site deploys from its own repo, get-smartplane/landing.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Typecheck and test before shipping
        run: |
          bun run typecheck
          bun run test
      # The committed Wrangler configs carry no production names or ids; the overlay (an environment secret)
      # turns each into wrangler.production.json, and every step deploys with that file.
      - name: Production Wrangler configs
        run: bun run --filter @pc/deploy production-config
        env:
          SMARTPLANE_PRODUCTION_OVERLAY: ${{ secrets.SMARTPLANE_PRODUCTION_OVERLAY }}
      # Order matters: the API binds the integration runners, and its code expects the migrated schema.
      - name: Integration runners
        working-directory: apps/integrations
        run: |
          bunx wrangler deploy -c wrangler.production.json
          bunx wrangler deploy -c wrangler.business.production.json
      - name: Database migrations
        working-directory: apps/api
        run: bunx wrangler d1 migrations apply DB --remote -c wrangler.production.json
      - name: API
        working-directory: apps/api
        run: bunx wrangler deploy -c wrangler.production.json
      - name: Dashboard
        working-directory: apps/web
        run: bun run build && bunx wrangler deploy -c wrangler.production.json
      - name: Smoke check
        run: curl --fail --silent --show-error https://app.smartplane.dev/health
